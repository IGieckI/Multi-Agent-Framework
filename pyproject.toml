[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-framework"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "networkx>=3.3",
    "torch>=2.6",
    "transformers>=4.56",
    "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
text = ["sentence-transformers>=3"]

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: loads a local model",
]
addopts = "-m 'not gpu'"
