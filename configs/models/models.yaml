# Mixed teams: a grid may name one as a model. Agents take the listed models in turn (sorted agent ids, cycling through
# the list), so 6 agents of mix-qgl are qwen, gemma, llama, qwen, gemma, llama and a 3-agent star's hub is qwen.
# All members are loaded at once (about 23 GB in bfloat16 here: L40 only)
teams:
  mix-qgl: [qwen3-4b, gemma3-4b, llama3.2-3b]
