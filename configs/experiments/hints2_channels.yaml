# Through which channel do the bigger models pool split notes (F51)? hints2_8b's and hints2_12b's split cell (decoys)
# with only the results shared, and with only the messages. Same seed and settings, so the same targets and notes:
# pairs with their fully_connected base (both channels) and all_independent (none), targets 0-39.
# hints2_channels_share.yaml adds messages only with the share instruction. L40 (SWEEP_SHARDS=2: one model per block)
name: hints2_channels
replicates: 40
seed: 0
versions: [base]
models: [qwen3-8b, gemma3-12b]
protocols:
  - {name: fully_connected_results, file: configs/protocols/fully_connected_results.yaml}
  - {name: fully_connected_messages, file: configs/protocols/fully_connected_messages.yaml}
task:
  - {hints: split, decoys: true}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2,
         depth: 2, distractors: 6, notes: 2, allow_shortcuts: false}
  engine: {max_concurrency: 1}
  sampling: {temperature: 1.0}   # max_tokens, reasoning, top_p and top_k come from configs/models/models.yaml
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600}
