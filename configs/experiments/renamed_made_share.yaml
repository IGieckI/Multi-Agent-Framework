# renamed_made.yaml's split teams told to tell their notes (task.share_notes), and one agent holding both notes with
# the sharing team's token budget. Base and one_vs_multi_token only: the silenced and single-agent runs would be
# renamed_made's (no message slot, so the instruction is not shown). Pairs with renamed_made and renamed_share.
# SWEEP_SHARDS=4 as in renamed_made: 0 (qwen3-4b) on rtx2080, 1-3 on L40
name: renamed_made_share
replicates: 40
seed: 0
versions: [base, one_vs_multi_token]
models: [qwen3-4b, gemma3-4b, qwen3-8b, gemma3-12b]
protocols:
  - {name: fully_connected, file: configs/protocols/fully_connected.yaml}
task:
  - {hints: split, decoys: true}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2r,
         depth: 2, distractors: 6, notes: 2, allow_shortcuts: false, rename: true, mark_made: true, share_notes: true}
  engine: {max_concurrency: 1, publish_on_no_op: true}
  sampling: {temperature: 1.0}   # max_tokens, reasoning, top_p and top_k come from configs/models/models.yaml
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600, show_matched_budget: true}
