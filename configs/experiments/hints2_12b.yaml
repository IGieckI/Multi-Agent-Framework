# Is F43 (qwen3-8b pools split notes through talk) about size or about that model? hints2's cells with a larger model
# of another family, same seed and settings, so the same targets and notes. gemma3-12b needs the L40 (24 GB in bfloat16).
name: hints2_12b
replicates: 40
seed: 0
versions: [base, all_independent, one_agent]
models: [gemma3-12b]
protocols:
  - {name: fully_connected, file: configs/protocols/fully_connected.yaml}
  - {name: star, file: configs/protocols/star2.yaml,
     personas: {hub: prompts/v1/personas/hub.txt, spoke: prompts/v1/personas/spoke.txt}}
task:
  - {hints: split, decoys: true}
  - {hints: split, decoys: false}
  - {hints: all, decoys: true}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2,
         depth: 2, distractors: 6, notes: 2, allow_shortcuts: false}
  engine: {max_concurrency: 1}
  sampling: {temperature: 1.0}
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600}
