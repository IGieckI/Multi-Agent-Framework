# Does the share instruction gain more when no message is lost (F50)? hints2_share's and hints2_8b_share's cells with
# engine.publish_on_no_op: the message of a turn whose answers were all refused is still sent (the holder of the
# target's recipe often plays it before the intermediate exists, and its message was dropped with the action).
# Same seed and settings, so the same targets and notes: pairs run by run with hints2_share and hints2_8b_share
# (use_notes false, targets 0-39).
# SWEEP_SHARDS=3 gives one model per block: 0 (qwen3-4b) on rtx2080, 1-2 (gemma3-4b, qwen3-8b) on L40
name: hints2_share_pub
replicates: 40
seed: 0
versions: [base]
models: [qwen3-4b, gemma3-4b, qwen3-8b]
protocols:
  - {name: fully_connected, file: configs/protocols/fully_connected.yaml}
task:
  - {hints: split, decoys: true}
  - {hints: split, decoys: false}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2,
         depth: 2, distractors: 6, notes: 2, allow_shortcuts: false, share_notes: true}
  engine: {max_concurrency: 1, publish_on_no_op: true}
  sampling: {temperature: 1.0}   # max_tokens, reasoning, top_p and top_k come from configs/models/models.yaml
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600}
