# Sequential instead of parallel turns (the tutor's question, 2026-11-12): main's settings and targets with
# - sequential: fully_connected, but agent_00 plays first and each next agent sees this round's earlier answers;
# - chain6: a relay, each agent hears only the one before it.
# Base only: the silenced twins are fully_connected's all_independent in followup (qwen3-4b, gemma3-4b, llama) and
# main (qwen3-8b), and fully_connected's base is the parallel version. Same seed and settings, so the same targets.
# Answers' confidence logged (engine.log_confidence).
# SWEEP_SHARDS=4 gives one model per block: 0-1 (qwen3-4b, llama) on rtx2080 like followup, 2-3 (gemma3-4b,
# qwen3-8b) on L40 like followup and main
name: chain
replicates: 20
seed: 0
versions: [base]
models: [qwen3-4b, llama3.2-3b, gemma3-4b, qwen3-8b]
protocols:
  - {name: sequential, file: configs/protocols/sequential.yaml}
  - {name: chain6, file: configs/protocols/chain6.yaml}
task:
  - {depth: 1, distractors: 3}
  - {depth: 2, distractors: 0}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2}
  engine: {max_concurrency: 1, log_confidence: true}
  sampling: {temperature: 1.0}   # max_tokens, reasoning, top_p and top_k come from configs/models/models.yaml
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600}
