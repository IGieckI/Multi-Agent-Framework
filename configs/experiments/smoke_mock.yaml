# The whole pipeline on the mock backend (no GPU, no model): plan, run in shards, evaluate.
#   python scripts/sweep.py plan configs/experiments/smoke_mock.yaml
#   python scripts/sweep.py run configs/experiments/smoke_mock.yaml --shard 0/2
name: smoke_mock
replicates: 2
versions: [base, all_independent, all_independent_temp_sweep, one_for_all, one_agent, one_agent_scaled_steps,
           one_vs_multi_token]
models: [mock]
protocols:
  - {name: isolated, file: configs/protocols/isolated.yaml}
  - {name: fully_connected, file: configs/protocols/fully_connected.yaml}
  - {name: debate_judge, file: configs/protocols/debate_judge.yaml}
task:
  distractors: [0, 3]
base:
  task: {name: wordcraft, type: targeted, depth: 1, max_steps: 4, repeat_consumes_step: true}
  sampling: {temperature: 1.0, max_tokens: 256, reasoning: true}
  context: {max_prompt_tokens: 6000}
