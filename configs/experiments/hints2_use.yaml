# The receiving side of F38: hints2_share's teams (holders told to tell their notes), now with every agent also told
# that the recipes the others pass on from their notes are true and to use them (task.use_notes). Same seed and task
# settings as hints2 and hints2_share, so the same targets and notes: compare with hints2_share pair by pair.
# qwen3-8b gets these runs in hints2_8b_share.yaml
name: hints2_use
replicates: 40
seed: 0
versions: [base]
models: [qwen3-4b, gemma3-4b, llama3.2-3b]
protocols:
  - {name: fully_connected, file: configs/protocols/fully_connected.yaml}
task:
  - {hints: split, decoys: true}
  - {hints: split, decoys: false}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2,
         depth: 2, distractors: 6, notes: 2, allow_shortcuts: false, share_notes: true, use_notes: true}
  engine: {max_concurrency: 1}
  sampling: {temperature: 1.0}
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600}
