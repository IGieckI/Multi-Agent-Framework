# Follow-up of the main experiment (FINDINGS.md F16-F22):
# - team size vs structure (F22): fully_connected and star with 3 and 6 agents each
# - what makes fully connected agents herd (F17): sharing only results, or only messages
# - the two baselines fixed: temperatures centred on 1.0 (F21), the token-matched agent sees its budget (F15)
name: followup
replicates: 20
seed: 0
versions: [base, all_independent, all_independent_temp_sweep, one_agent, one_vs_multi_token]
models: [qwen3-4b, gemma3-4b, llama3.2-3b]
protocols:
  - {name: fully_connected, file: configs/protocols/fully_connected.yaml}
  - {name: star, file: configs/protocols/star2.yaml,
     personas: {hub: prompts/v1/personas/hub.txt, spoke: prompts/v1/personas/spoke.txt}}
  - {name: fully_connected3, file: configs/protocols/fully_connected3.yaml}
  - {name: star6, file: configs/protocols/star6.yaml,
     personas: {hub: prompts/v1/personas/hub.txt, spoke: prompts/v1/personas/spoke.txt}}
  - {name: fully_connected_results, file: configs/protocols/fully_connected_results.yaml}
  - {name: fully_connected_messages, file: configs/protocols/fully_connected_messages.yaml}
task:
  - {depth: 1, distractors: 3}
  - {depth: 2, distractors: 0}
base:
  task: {name: wordcraft, type: targeted, max_steps: 4, repeat_consumes_step: true, prompts: v2}
  engine: {max_concurrency: 1}
  sampling: {temperature: 1.0, sweep_temperatures: [0.7, 1.0, 1.3]}
  context: {max_prompt_tokens: 6000, truncation: oldest_first}
  retries: {max_parse_attempts: 3, max_attempts: 3}
  budget: {wall_clock_s: 3600, show_matched_budget: true}
